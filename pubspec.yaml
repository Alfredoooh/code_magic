name: doction_editor
description: Document editor - pixel perfect Flutter port
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_quill: ^9.6.0
  lucide_icons: any
  google_fonts: any
  provider: any
  file_picker: any
  image_picker: any
  flutter_colorpicker: any
  collection: any

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/