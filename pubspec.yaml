name: doction_editor
description: Document editor - pixel perfect Flutter port
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_quill: ^10.6.7
  google_fonts: ^6.2.1
  http: ^1.2.1
  file_picker: ^8.0.3
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  printing: ^5.13.1
  pdf: ^3.11.1

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true