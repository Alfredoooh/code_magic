name: doction_editor
description: Document editor - pixel perfect Flutter port
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
    # Editor de texto rico
  flutter_quill: 10.8.5
  flutter_quill_extensions: ^10.0.0

  # State management
  provider: ^6.1.2

  # HTTP (Claude AI)
  http: ^1.2.1

  # Google Fonts
  google_fonts: ^6.2.1

  # File picker (inserir imagens)
  file_picker: ^8.0.0+1

  # URL launcher (links)
  url_launcher: ^6.3.0

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/