name: doction_editor
description: Document editor - pixel perfect Flutter port
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_quill: ^10.8.4
  lucide_icons: ^0.0.1
  google_fonts: ^6.2.1
  provider: ^6.1.2
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0
  collection: ^1.18.0

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/