name: printerNet
description: 
publish_to: 'none'
version: 1.2.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.9
  animations: ^2.0.11
  material_symbols_icons: ^4.2785.1
  ionicons: any
  xml: ^6.3.0
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.1
  webview_flutter: ^4.4.2
  translator: ^0.1.7
  palette_generator: any
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/icon.png
  android: true
  ios: true
  web: true