<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="printerNet - Rede social acadêmica">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="printerNet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>simplicity - Estudantes</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Dark theme color -->
  <meta name="theme-color" content="#121212">

  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #121212; /* tema escuro simples */
      color: #E4E6EB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Fullscreen centered container */
    .loading {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #121212; /* sem gradiente */
    }

    .message {
      font-size: 20px;
      font-weight: 500;
      color: #E4E6EB;
      line-height: 1.4;
      letter-spacing: 0.2px;
    }

    /* Small footer text (optional, discreto) */
    .footer {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: #8E8E93;
      pointer-events: none;
    }

    /* Make sure loading is visible until flutter-first-frame */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div>
      <div class="message">Aguarde um pouquinho</div>
    </div>
  </div>

  <div class="footer" id="footer"> </div>

  <script>
    // Mantém registro do service worker como antes
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js').catch(()=>{});
      });
    }

    // Remove loading screen quando o Flutter renderizar o primeiro frame
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
      }
    });

    // Fallback: remove loading após 30s caso flutter-first-frame não dispare
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        loading.classList.add('hidden');
      }
    }, 30000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
